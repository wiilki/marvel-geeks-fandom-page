name: Probe comic cover title variants
on:
  pull_request:
    paths:
      - 'scripts/probe_cover_titles.py'
      - '.github/workflows/research-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Query historical comic issue title variants
        run: python3 -u scripts/probe_cover_titles.py
