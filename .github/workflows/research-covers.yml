name: Verify missing editorial comic covers
on:
  pull_request:
    paths:
      - 'scripts/research_remaining_covers.py'
      - '.github/workflows/research-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing comic issue identities and fetch covers
        run: python3 -u scripts/research_remaining_covers.py
