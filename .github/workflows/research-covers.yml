name: Verify Ms Marvel 2014 cover (research)
on:
  pull_request:
    paths:
      - 'scripts/probe_ms_marvel.py'
      - '.github/workflows/research-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/probe_ms_marvel.py
